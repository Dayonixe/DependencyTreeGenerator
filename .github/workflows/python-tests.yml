name: Run Python tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
        include:
          - os: windows-latest
            python-version: '3.12'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r config/requirements.txt

    - name: Install Graphviz on Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz

    - name: Install Graphviz on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install graphviz --yes --no-progress
        "$env:ProgramFiles\Graphviz\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Verify native Graphviz
      run: dot -V

    - name: Run tests
      run: |
        python -m pytest tests/
